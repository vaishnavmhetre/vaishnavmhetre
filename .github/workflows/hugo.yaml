name: Deploy Hugo site to Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
defaults: { run: { shell: bash } }
jobs:
  build:
    runs-on: ubuntu-latest
    env: { HUGO_VERSION: 0.166.0, GO_VERSION: 1.27.0 }
    steps:
      - uses: actions/checkout@v7  # submodules: recursive, fetch-depth: 0
      - id: pages
        uses: actions/configure-pages@v6
      - if: hashFiles('go.mod') != ''
        uses: actions/setup-go@v7
        with: { go-version: "${{ env.GO_VERSION }}", cache: false }
      - name: Install Hugo (Extended)
        run: |
          curl -sfL --output-dir "${{ runner.temp }}" -O "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "$HOME/bin"; tar -C "$HOME/bin" -xzf "${{ runner.temp }}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build
        run: |
          hugo mod get -u github.com/adityatelange/hugo-PaperMod || true
          hugo mod tidy || true
          HUGO_ENVIRONMENT=production hugo build --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v5
        with: { path: ./public, include-hidden-files: false }
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
